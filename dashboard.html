<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&A Dashboard - One-Stop Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        
        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: -2;
        }
        
        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #d4af37 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation: float 20s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f4e4c1 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
            animation: float 15s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        
        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 50%, rgba(212, 175, 55, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .glass-card:hover::before {
            opacity: 1;
        }
        
        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.3);
        }
        
        /* Icon Container */
        .icon-container {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover .icon-container {
            transform: scale(1.1) rotate(5deg);
        }
        
        .icon-ramadan {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
        }
        
        .icon-health {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }
        
        .icon-wealth {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        .delay-200 { animation-delay: 0.2s; opacity: 0; }
        .delay-400 { animation-delay: 0.4s; opacity: 0; }
        .delay-600 { animation-delay: 0.6s; opacity: 0; }
        
        /* Header Styles */
        .header-gradient {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .glass-card {
                padding: 1.5rem;
            }
            
            .icon-container {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    
    <!-- Header -->
    <header class="header-gradient py-6 px-4 relative z-10">
        <div class="max-w-7xl mx-auto">
            <div class="text-center">
                <h1 class="serif-font text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600 mb-2">
                    D&A Dashboard
                </h1>
                <p class="text-gray-400 text-sm md:text-base">
                    One-Stop Solution for Our Journey Together
                </p>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- Ramadan Kareem Card -->
            <div class="glass-card fade-in-up delay-200" onclick="openSpreadsheet('https://docs.google.com/spreadsheets/d/1uoYuktUAzOShsOzgUIJ59-pRu814RjlW/edit?usp=drive_link&ouid=101326731190925663342&rtpof=true&sd=true')">
                <div class="icon-container icon-ramadan">
                    <i data-lucide="moon" class="w-10 h-10 text-white"></i>
                </div>
                <h3 class="text-xl md:text-2xl font-semibold text-white mb-3">
                    Ramadan Kareem
                </h3>
                <p class="text-gray-400 text-sm md:text-base leading-relaxed">
                    Logging our spiritual journey together.
                </p>
                <div class="mt-4 flex items-center text-yellow-400 text-sm">
                    <span>Open Spreadsheet</span>
                    <i data-lucide="external-link" class="w-4 h-4 ml-2"></i>
                </div>
            </div>
            
            <!-- Stay Healthy Card -->
            <div class="glass-card fade-in-up delay-400" onclick="openSpreadsheet('https://docs.google.com/spreadsheets/d/1AkRPKP5KT6l-F1_AApRjoKhz_bp5FZYuGkgWjbvtc7s/edit?usp=drive_link')">
                <div class="icon-container icon-health">
                    <i data-lucide="heart" class="w-10 h-10 text-white"></i>
                </div>
                <h3 class="text-xl md:text-2xl font-semibold text-white mb-3">
                    Stay Healthy
                </h3>
                <p class="text-gray-400 text-sm md:text-base leading-relaxed">
                    Tracking our wellness and fitness goals.
                </p>
                <div class="mt-4 flex items-center text-green-400 text-sm">
                    <span>Open Spreadsheet</span>
                    <i data-lucide="external-link" class="w-4 h-4 ml-2"></i>
                </div>
            </div>
            
            <!-- Stay Wealthy Card -->
            <div class="glass-card fade-in-up delay-600" onclick="openSpreadsheet('https://docs.google.com/spreadsheets/d/1j_36i5KjWCOTvq5OjMT83nSZITElIyQGYj3fcSUGDMo/edit?usp=drive_link')">
                <div class="icon-container icon-wealth">
                    <i data-lucide="trending-up" class="w-10 h-10 text-white"></i>
                </div>
                <h3 class="text-xl md:text-2xl font-semibold text-white mb-3">
                    Stay Wealthy
                </h3>
                <p class="text-gray-400 text-sm md:text-base leading-relaxed">
                    Managing our shared growth and prosperity.
                </p>
                <div class="mt-4 flex items-center text-blue-400 text-sm">
                    <span>Open Spreadsheet</span>
                    <i data-lucide="external-link" class="w-4 h-4 ml-2"></i>
                </div>
            </div>
            
        </div>
        
        <!-- Back to Home Button -->
        <div class="text-center mt-12">
            <button onclick="goHome()" class="px-6 py-3 border border-yellow-400 text-yellow-400 rounded-full hover:bg-yellow-400 hover:text-black transition-all duration-300 flex items-center mx-auto">
                <i data-lucide="home" class="w-4 h-4 mr-2"></i>
                Back to Home
            </button>
        </div>
    </main>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Open spreadsheet in new tab
        function openSpreadsheet(url) {
            window.open(url, '_blank');
        }
        
        // Go back to home page
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Add parallax effect on mouse move
        document.addEventListener('mousemove', function(e) {
            const orbs = document.querySelectorAll('.gradient-orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 10;
                orb.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
        
        // Add floating animation to cards on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.glass-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
